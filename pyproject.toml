[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kingdee-mcp-ierp"
version = "0.1.2"
description = "Kingdee-ierp MCP Server for sales order and manufacturing order queries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "requests>=2.31.0",
  "openpyxl>=3.1.0",
]

[project.scripts]
kingdee-mcp-ierp = "kingdee_mcp_uvx.kingdee_mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
